{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h2>Dataset Overview</h2>

<table class="table table-bordered table-striped w-50 mb-4">
    <thead class="table-dark">
        <tr>
            <th>Total Rows</th>
            <th>Total Columns</th>
            <th>Target Column</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>{{ summary.rows }}</td>
            <td>{{ summary.columns }}</td>
            <td>{{ summary.target }}</td>
        </tr>
    </tbody>
</table>
    <h3>First Five  Rows</h3>
    <div class="table-responsive">
        {{ first_rows | safe }}
    </div>
</div>
{% endblock %}
