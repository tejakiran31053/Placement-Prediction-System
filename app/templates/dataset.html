{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h2>Dataset Overview</h2>

    <div class="row my-3">
        <div class="col-md-4">
            <p><strong>Total Rows:</strong> {{ summary.rows }}</p>
        </div>
        <div class="col-md-4">
            <p><strong>Total Columns:</strong> {{ summary.columns }}</p>
        </div>
        <div class="col-md-4">
            <p><strong>Target Column:</strong> {{ summary.target }}</p>
        </div>
    </div>

    <h3>First Few Rows</h3>
    <div class="table-responsive">
        {{ first_rows | safe }}
    </div>
</div>
{% endblock %}
